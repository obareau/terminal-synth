<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>terminal-synth</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #0a0a0a; overflow: hidden; }
    #app { position: fixed; inset: 0; background: #000; }
    #gl, #ascii { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ascii {
      margin: 0; padding: 0;
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      color: #9be29b; background: #000;
      white-space: pre; overflow: hidden;
      letter-spacing: 0; text-shadow: 0 0 4px rgba(120, 255, 140, 0.35);
    }
    [hidden] { display: none !important; }

    #bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 0.5em;
      padding: 0.4em 0.6em;
      font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px;
      color: #8a8a8a;
      background: linear-gradient(#0c0c0cdd, #0c0c0c66 70%, transparent);
      user-select: none;
    }
    #bar .brand { color: #9be29b; font-weight: 700; letter-spacing: 0.06em; margin-right: 0.4em; }
    #bar select, #bar button {
      font: inherit; color: #cfcfcf; background: #161616;
      border: 1px solid #060606; height: 22px; padding: 0 0.6em; border-radius: 2px; cursor: pointer;
    }
    #bar button:hover, #bar select:hover { background: #1e1e1e; }
    #bar button.on  { color: #0a0a0a; background: #9be29b; border-color: #060606; font-weight: 700; }
    #bar button.rec { color: #ff4444; border-color: #ff2222; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }
    #bar .spacer { flex: 1; }
    #meter { color: #6a6a6a; }

    #chain {
      position: absolute; top: 34px; left: 0; right: 0; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em;
      padding: 0.3em 0.6em;
      font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; color: #8a8a8a;
      background: linear-gradient(#0c0c0ccc, transparent);
      user-select: none;
    }
    #chain .arrow { color: #4a4a4a; }
    #chain .gen { color: #9be29b; }
    .fx {
      display: inline-flex; align-items: center; gap: 0.35em;
      padding: 0.15em 0.4em; border: 1px solid #1a1a1a; border-radius: 3px; background: #0e0e0e;
    }
    .fx.on { border-color: #9be29b55; color: #cfcfcf; }
    .fx-name { min-width: 4.5em; }
    .fx input[type="range"] { width: 70px; accent-color: #9be29b; }
    .fx input[type="checkbox"] { accent-color: #9be29b; }

    #text {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      margin: 0; padding: 0.6em 0.9em 1.1em;
      font-family: "Cascadia Mono", Consolas, monospace; font-size: 15px; line-height: 1.35;
      color: #9be29b; text-shadow: 0 0 6px rgba(120, 255, 140, 0.5);
      white-space: pre-wrap; word-break: break-word; pointer-events: none;
      max-width: 70ch; mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <pre id="ascii" hidden></pre>
    <pre id="text" hidden></pre>
    <div id="bar">
      <span class="brand">terminal-synth</span>
      <span style="color:#4a4a4a;font-size:10px">A</span>
      <select id="shader" title="Shader / générateur"></select>
      <select id="blend-mode" title="Mode de fusion des layers"></select>
      <span style="color:#4a4a4a;font-size:10px">B</span>
      <select id="layer-b-shader" title="Layer B"></select>
      <button id="layer-b-on" title="Activer / désactiver layer B">B</button>
      <input id="layer-b-opacity" type="range" min="0" max="1" step="0.01" value="1" title="Opacité layer B" style="width:55px;accent-color:#9be29b;vertical-align:middle">
      <select id="audio-src" title="Source audio">
        <option value="system">🔊 Système</option>
        <option value="mic">🎤 Micro</option>
      </select>
      <button id="audio" title="Activer l'entrée audio">audio</button>
      <button id="midi" title="Activer le MIDI">🎛 MIDI</button>
      <select id="midi-mode" title="Mode de jeu MIDI">
        <option value="organ">Orgue</option>
        <option value="noise">Noise</option>
      </select>
      <button id="isf-load" title="Charger un shader ISF (Interactive Shader Format)">ISF…</button>
      <button id="spout" title="Activer la sortie Spout (Windows — nécessite un addon natif pour la vraie sortie)">SPOUT</button>
      <button id="ascii-toggle" title="Mode ASCII">ASCII</button>
      <input id="ascii-cols" type="range" min="20" max="200" step="5" title="Densité ASCII (colonnes)" style="width:70px;accent-color:#9be29b;vertical-align:middle">
      <button id="text-toggle" title="Overlay texte (transmissions)">TXT</button>
      <input id="recta-speed" type="range" min="500" max="12000" step="250" value="4200" title="Durée d'affichage RECTA (ms)" style="width:60px;accent-color:#9be29b;vertical-align:middle">
      <button id="preset-save" title="Sauvegarder le preset">💾</button>
      <button id="preset-load" title="Charger un preset">📂</button>
      <button id="rec" title="Enregistrer la vidéo (WebM)">⏺ REC</button>
      <button id="full" title="Plein écran">⛶</button>
      <span class="spacer"></span>
      <span id="meter"></span>
    </div>
    <div id="chain">
      <span class="gen">génération</span><span class="arrow">→</span>
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
